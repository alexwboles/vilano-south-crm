<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in — GR CRM</title>
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="theme-color" content="#16233f">
<link rel="manifest" href="/manifest.json">
<link rel="stylesheet" href="/styles.css">
</head>
<body class="login-page">
<div class="login-wrap">
  <div class="login-card">
    <img class="login-mark" src="/icon-192.png" alt="" width="60" height="60">
    <h1>GR CRM</h1>
    <p class="sub">Vilano South · Government Relations</p>
    <div class="form-err" id="err"></div>
    <form id="login-form" autocomplete="off">
      <div class="field">
        <label for="email">Email</label>
        <input type="email" id="email" required autocomplete="username">
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input type="password" id="password" required autocomplete="current-password">
      </div>
      <button class="btn primary" type="submit" style="width:100%;justify-content:center">Sign in</button>
    </form>
    <div class="demo-note">Demo build: sign in with <strong>demo@vilano.local</strong> / <strong>changeme</strong>. Change or remove this account before real use — see README.</div>
  </div>
</div>
<script src="/login.js"></script>
<script>
if ("serviceWorker" in navigator) { window.addEventListener("load", () => navigator.serviceWorker.register("/sw.js").catch(() => {})); }
</script>
</body>
</html>
