<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Set up — GR CRM</title>
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="theme-color" content="#16233f">
<link rel="stylesheet" href="/styles.css">
</head>
<body class="login-page">
<div class="login-wrap">
  <div class="login-card">
    <img class="login-mark" src="/icon-192.png" alt="" width="60" height="60">
    <h1>Set up GR CRM</h1>
    <p class="sub">Vilano South · Government Relations</p>
    <p class="setup-intro">Create the administrator account. Only approved email addresses will ever be able to sign in.</p>
    <div class="form-err" id="err"></div>
    <form id="setup-form" autocomplete="off">
      <div class="field">
        <label for="email">Administrator email</label>
        <input type="email" id="email" required autocomplete="username" placeholder="you@example.com">
      </div>
      <div class="field">
        <label for="password">Password <span class="hint">(8+ characters)</span></label>
        <input type="password" id="password" required autocomplete="new-password" minlength="8">
      </div>
      <div class="field">
        <label for="confirm">Confirm password</label>
        <input type="password" id="confirm" required autocomplete="new-password" minlength="8">
      </div>
      <div class="field">
        <label for="allowlist">Approved emails <span class="hint">(optional, one per line)</span></label>
        <textarea id="allowlist" rows="3" placeholder="colleague@example.com"></textarea>
      </div>
      <button class="btn primary" type="submit" id="submit" style="width:100%;justify-content:center">Create account</button>
    </form>
  </div>
</div>
<script src="/setup.js"></script>
</body>
</html>
